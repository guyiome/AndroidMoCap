[versions]
agp = "9.3.1"
kotlin = "2.4.10"
junit = "4.13.2"
coreKtx = "1.19.0"
lifecycleRuntimeKtx = "2.11.0"
activityCompose = "1.13.0"
composeBom = "2026.06.01"
camerax = "1.5.1"
arcore = "1.54.0"
mediapipeTasksVision = "1.0.0"
javaosc = "0.9"
datastorePreferences = "1.1.7"
nvWebsocketClient = "2.14"
kotlinxSerializationJson = "1.11.0"
# 1.7.1 : dernière version stable au moment de l'ajout (1.8.0-rc01 est une pré-version, exclue --
# vérifié via dl.google.com/android/maven2, search.maven.org n'indexe pas les artefacts AndroidX).
appcompat = "1.8.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }

# Caméra
androidx-camera-core = { group = "androidx.camera", name = "camera-core", version.ref = "camerax" }
androidx-camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
androidx-camera-view = { group = "androidx.camera", name = "camera-view", version.ref = "camerax" }

# Tracking : ARCore Augmented Faces + MediaPipe Face Landmarker
google-ar-core = { group = "com.google.ar", name = "core", version.ref = "arcore" }
mediapipe-tasks-vision = { group = "com.google.mediapipe", name = "tasks-vision", version.ref = "mediapipeTasksVision" }

# Diffusion réseau : encodage/envoi OSC pour le protocole VMC
javaosc-core = { group = "com.illposed.osc", name = "javaosc-core", version.ref = "javaosc" }

# Diffusion réseau : client WebSocket pour l'API Plugin de VTube Studio (point 39) -- envoi direct,
# alternative à VMC qui n'est vraisemblablement pas reçu nativement par VTube Studio (voir revue
# technique). JSON de la même API via kotlinx.serialization.
#
# nv-websocket-client plutôt qu'OkHttp (essayé en premier, retiré le 8 août 2026) : OkHttp propose
# systématiquement l'extension WebSocket permessage-deflate, sans réglage public pour la désactiver
# (même un intercepteur réseau retirant l'en-tête Sec-WebSocket-Extensions échoue -- OkHttp l'ajoute
# à un niveau plus bas, hors de portée des intercepteurs). Le serveur VTube Studio
# ("Server: websocket-sharp/1.0") a une implémentation buguée de cette extension avec
# no_context_takeover (incompatibilité documentée, github.com/sta/websocket-sharp/issues/666) :
# la connexion s'ouvrait normalement, la requête partait, mais aucune réponse n'était jamais
# lisible côté app -- confirmé sur device par plusieurs allers-retours de diagnostic (voir revue
# technique, point 39). nv-websocket-client ne propose permessage-deflate que si on l'active
# explicitement (`addExtension`) -- jamais par défaut, contrairement à OkHttp.
nv-websocket-client = { group = "com.neovisionaries", name = "nv-websocket-client", version.ref = "nvWebsocketClient" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }

# Persistance des réglages de calibrage
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastorePreferences" }

# Sélecteur de langue en-app (point 30) : MainActivity doit étendre AppCompatActivity pour que
# AppCompatDelegate.setApplicationLocales() fonctionne avec Compose (doc officielle Android, voir
# MainActivity.kt) -- pas de rapport avec les autres usages d'AndroidX déjà présents (aucun n'est
# du support UI classique). Fournit aussi AppLocalesMetadataHolderService (persistance auto de la
# langue choisie sur toutes les versions d'Android, voir AndroidManifest.xml).
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }

# Tests unitaires (JVM pur, voir AndroidMoCap_tests_unitaires.md pour ce qui est couvert et pourquoi)
junit = { group = "junit", name = "junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# Pas de plugin "kotlin-android" : AGP 9+ compile Kotlin nativement (built-in Kotlin).
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
