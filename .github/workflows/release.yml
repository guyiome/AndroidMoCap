name: Release

# Se déclenche uniquement sur un tag de version (ex. v0.2.0) poussé sur le dépôt --
# voir la section "Publier une version" du README pour la procédure complète. Un tag contenant
# "-beta" (ex. v0.3.0-beta.1) publie une Release marquée "prerelease" -- canal beta, voir plus bas.
on:
  push:
    tags:
      - "v*"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # nécessaire pour créer la Release GitHub et y attacher l'APK
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer le JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Télécharger le modèle MediaPipe (voir README, non versionné)
        run: |
          mkdir -p app/src/main/assets
          curl -fL -o app/src/main/assets/face_landmarker.task \
            https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/latest/face_landmarker.task

      - name: Reconstituer la clé de signature depuis le secret
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "${{ runner.temp }}/release.keystore"

      - name: Builder l'APK release signé
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Nettoyer la clé de signature
        if: always()
        run: rm -f "${{ runner.temp }}/release.keystore"

      - name: Publier la Release GitHub avec l'APK
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
          # Canal beta : un tag contenant "-beta" (ex. v0.3.0-beta.1) publie une prerelease --
          # ignorée par défaut par les outils de suivi de release (Obtainium et similaires) sauf
          # activation explicite, sans changer le déclencheur ni le contenu du build lui-même.
          prerelease: ${{ contains(github.ref_name, '-beta') }}
