name: CodeQL

# Analyse de sécurité statique (build-mode manuel : l'auto-build de CodeQL gère mal ce Gradle
# multi-module, et le modèle MediaPipe doit être présent avant toute compilation, comme dans
# ci.yml). Se déclenche sur push/PR vers main (mêmes garde-fous que ci.yml) et une fois par
# semaine pour attraper les nouvelles règles CodeQL même sans changement de code. Résultats dans
# l'onglet Security > Code scanning, pas dans les logs de ce workflow.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "17 3 * * 1"

jobs:
  analyze:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer le JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurer Gradle (cache "enhanced", gratuit sur repo public)
        uses: gradle/actions/setup-gradle@v6

      - name: Télécharger le modèle MediaPipe (voir README, non versionné)
        run: |
          mkdir -p app/src/main/assets
          curl -fL -o app/src/main/assets/face_landmarker.task \
            https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/latest/face_landmarker.task

      - name: Initialiser CodeQL
        # Couplage Kotlin <-> CodeQL, piège avéré (PR #34, septembre 2026) : en build-mode manuel
        # l'extraction compile réellement, donc un compilateur Kotlin plus récent que l'extracteur
        # fait échouer TOUT le job, pas seulement l'analyse Kotlin ("Kotlin version X is too recent.
        # CodeQL currently supports versions below Y").
        #
        # Ce n'est PAS la version de l'action qui décide : v3 et v4 embarquent le même bundle CodeQL
        # (defaults.json identique des deux côtés). Ce qui décide, c'est le CLI embarqué, dont la
        # liste de versions Kotlin acceptées vit dans java/kotlin-extractor/versions.bzl chez
        # github/codeql. Aucune version de CLI n'est épinglée ici, et c'est délibéré : le support
        # rattrape alors tout seul (le CLI 2.27.0 s'arrêtait à Kotlin 2.4.0, le 2.27.1 a ajouté
        # 2.4.20 six jours après l'échec de la PR #34).
        #
        # Si un futur bump Kotlin rougit ce job : attendre le bundle suivant. NE PAS dégainer
        # CODEQL_EXTRACTOR_JAVA_AGENT_DISABLE_KOTLIN=true -- l'app est intégralement en Kotlin, donc
        # cela publierait une analyse de sécurité vide tout en affichant un check vert.
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Build debug (nécessaire pour l'extraction CodeQL en build-mode manuel)
        # --no-build-cache : sans ça, si build-and-test a déjà tourné sur ce même commit,
        # compileDebugKotlin ressort UP-TO-DATE/FROM-CACHE, aucun compilateur n'est réellement
        # invoqué et CodeQL échoue avec "could not process any code written in Java/Kotlin".
        run: ./gradlew clean assembleDebug --no-build-cache

      - name: Exécuter l'analyse CodeQL
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java-kotlin"
